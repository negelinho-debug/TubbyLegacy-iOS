          #import <UIKit/UIKit.h>
          #import "app_bridge.h"

          @interface LegacyControls : UIView
          @property(nonatomic, strong) NSMutableDictionary<NSNumber *, UIButton *> *buttons;
          @end

          @implementation LegacyControls
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (!self) return nil;
              self.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.multipleTouchEnabled = YES;
              self.buttons = [NSMutableDictionary dictionary];
              NSDictionary<NSNumber *, NSString *> *labels = @{
                  @(MKXP_SCANCODE_UP): @"â", @(MKXP_SCANCODE_LEFT): @"â",
                  @(MKXP_SCANCODE_DOWN): @"â", @(MKXP_SCANCODE_RIGHT): @"â",
                  @(MKXP_SCANCODE_RETURN): @"OK", @(MKXP_SCANCODE_ESCAPE): @"BACK",
                  @(MKXP_SCANCODE_Q): @"â", @(MKXP_SCANCODE_W): @"â¶"
              };
              [labels enumerateKeysAndObjectsUsingBlock:^(NSNumber *key, NSString *label, BOOL *stop) {
                  UIButton *button = [UIButton buttonWithType:UIButtonTypeSystem];
                  button.tag = key.integerValue;
                  button.tintColor = UIColor.whiteColor;
                  button.backgroundColor = [UIColor colorWithWhite:0.06 alpha:0.78];
                  button.layer.cornerRadius = 12;
                  button.layer.borderWidth = 1;
                  button.layer.borderColor = [UIColor colorWithWhite:1 alpha:0.34].CGColor;
                  button.accessibilityLabel = label;
                  button.titleLabel.font = [UIFont systemFontOfSize:label.length > 2 ? 12 : 20 weight:UIFontWeightSemibold];
                  [button setTitle:label forState:UIControlStateNormal];
                  [button addTarget:self action:@selector(buttonDown:) forControlEvents:UIControlEventTouchDown | UIControlEventTouchDragEnter];
                  [button addTarget:self action:@selector(buttonUp:) forControlEvents:UIControlEventTouchUpInside | UIControlEventTouchUpOutside | UIControlEventTouchCancel | UIControlEventTouchDragExit];
                  [self addSubview:button];
                  self.buttons[key] = button;
              }];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(releaseButtons:) name:UIApplicationWillResignActiveNotification object:nil];
              return self;
          }

          - (void)buttonDown:(UIButton *)button {
              mkxp_injectKeyEvent((int)button.tag, 1);
          }

          - (void)buttonUp:(UIButton *)button {
              mkxp_injectKeyEvent((int)button.tag, 0);
          }

          - (void)releaseButtons:(NSNotification *)notification {
              for (UIButton *button in self.buttons.allValues) [self buttonUp:button];
          }

          - (void)layoutSubviews {
              [super layoutSubviews];
              CGRect safe = UIEdgeInsetsInsetRect(self.bounds, self.safeAreaInsets);
              CGFloat size = MIN(50, MAX(38, CGRectGetWidth(safe) * 0.066));
              CGFloat stride = size + 7;
              CGFloat x = CGRectGetMinX(safe) + 8;
              CGFloat y = CGRectGetMaxY(safe) - size - 8;
              CGFloat right = CGRectGetMaxX(safe) - size - 8;
              self.buttons[@(MKXP_SCANCODE_UP)].frame = CGRectMake(x + stride, y - stride, size, size);
              self.buttons[@(MKXP_SCANCODE_LEFT)].frame = CGRectMake(x, y, size, size);
              self.buttons[@(MKXP_SCANCODE_DOWN)].frame = CGRectMake(x + stride, y, size, size);
              self.buttons[@(MKXP_SCANCODE_RIGHT)].frame = CGRectMake(x + stride * 2, y, size, size);
              self.buttons[@(MKXP_SCANCODE_RETURN)].frame = CGRectMake(right, y, size, size);
              self.buttons[@(MKXP_SCANCODE_ESCAPE)].frame = CGRectMake(right - stride, y, size, size);
              self.buttons[@(MKXP_SCANCODE_Q)].frame = CGRectMake(right - stride, y - stride, size, size);
              self.buttons[@(MKXP_SCANCODE_W)].frame = CGRectMake(right, y - stride, size, size);
          }

          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hit = [super hitTest:point withEvent:event];
              return hit == self ? nil : hit;
          }
          @end

          static UIWindow *startupWindow;
          static BOOL gameStarted;

          static void attachControls(float x, float y, float width, float height, void *context) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = (__bridge UIWindow *)mkxp_getGameWindow();
                  if (!window) return;
                  static NSInteger controlsTag = 9213;
                  if ([window viewWithTag:controlsTag]) return;
                  LegacyControls *controls = [[LegacyControls alloc] initWithFrame:window.bounds];
                  controls.tag = controlsTag;
                  [window addSubview:controls];
              });
          }

          static void showError(const char *message, void *context) {
              NSString *text = message ? [NSString stringWithUTF8String:message] : @"";
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = (__bridge UIWindow *)mkxp_getGameWindow();
                  UIViewController *root = window.rootViewController ?: startupWindow.rootViewController;
                  if (!root) {
                      mkxp_signalErrorDismissed();
                      return;
                  }
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"TubbyLegacy"
                      message:text preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault
                      handler:^(__unused UIAlertAction *action) { mkxp_signalErrorDismissed(); }]];
                  [root presentViewController:alert animated:YES completion:nil];
              });
          }

          static void startGame(void) {
              NSFileManager *files = NSFileManager.defaultManager;
              NSString *resources = NSBundle.mainBundle.resourcePath;
              NSString *documents = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              NSString *game = [documents stringByAppendingPathComponent:@"TubbyLegacy-v010"];
              if (![files fileExistsAtPath:game]) {
                  NSString *source = [resources stringByAppendingPathComponent:@"Game"];
                  NSString *staging = [documents stringByAppendingPathComponent:@"TubbyLegacy-import"];
                  [files removeItemAtPath:staging error:nil];
                  NSError *error = nil;
                  if (![files copyItemAtPath:source toPath:staging error:&error] ||
                      ![files moveItemAtPath:staging toPath:game error:&error]) {
                      showError(error.localizedDescription.UTF8String, NULL);
                      return;
                  }
              }
              [UIApplication sharedApplication].idleTimerDisabled = YES;
              mkxp_setLauncherIdentity("TubbyLegacy iOS", "0.1.0");
              mkxp_setUserDataDirectory(documents.fileSystemRepresentation);
              mkxp_setSharedFontsDirectory([resources stringByAppendingPathComponent:@"Assets.bundle/Fonts"].fileSystemRepresentation);
              mkxp_setCABundlePath([resources stringByAppendingPathComponent:@"Assets.bundle/cacert.pem"].fileSystemRepresentation);
              mkxp_setManagedConfigDir(game.fileSystemRepresentation);
              mkxp_setActiveRubyVersion(MKXP_RUBY_31);
              mkxp_setGameRectChangedCallback(attachControls, NULL);
              mkxp_setErrorMessageCallback(showError, NULL);
              mkxp_setGamePath(game.fileSystemRepresentation);
              char *argv[] = { "TubbyLegacy", NULL };
              mkxp_run_app(1, argv);
              UIWindow *window = (__bridge UIWindow *)mkxp_getGameWindow();
              [window setHidden:YES];
              UIApplication.sharedApplication.idleTimerDisabled = NO;
              [startupWindow makeKeyAndVisible];
          }

          @interface LegacySceneDelegate : UIResponder <UIWindowSceneDelegate>
          @property(nonatomic, strong) UIWindow *window;
          @end

          @implementation LegacySceneDelegate
          - (void)scene:(UIScene *)scene willConnectToSession:(UISceneSession *)session
                options:(UISceneConnectionOptions *)options {
              if (![scene isKindOfClass:UIWindowScene.class]) return;
              self.window = [[UIWindow alloc] initWithWindowScene:(UIWindowScene *)scene];
              self.window.rootViewController = [UIViewController new];
              self.window.rootViewController.view.backgroundColor = UIColor.blackColor;
              UILabel *name = [UILabel new];
              name.text = @"TubbyLegacy";
              name.textColor = UIColor.whiteColor;
              name.font = [UIFont systemFontOfSize:24 weight:UIFontWeightSemibold];
              name.translatesAutoresizingMaskIntoConstraints = NO;
              [self.window.rootViewController.view addSubview:name];
              [NSLayoutConstraint activateConstraints:@[
                  [name.centerXAnchor constraintEqualToAnchor:self.window.rootViewController.view.centerXAnchor],
                  [name.centerYAnchor constraintEqualToAnchor:self.window.rootViewController.view.centerYAnchor]
              ]];
              startupWindow = self.window;
              [self.window makeKeyAndVisible];
              if (!gameStarted) {
                  gameStarted = YES;
                  [NSTimer scheduledTimerWithTimeInterval:0.1 repeats:NO block:^(__unused NSTimer *timer) { startGame(); }];
              }
          }
          @end

          @interface LegacyAppDelegate : UIResponder <UIApplicationDelegate>
          @end
          @implementation LegacyAppDelegate
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass(LegacyAppDelegate.class));
              }
          }
          TUBBYLEGACY_HOST_M
