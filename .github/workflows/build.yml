name: TubbyLegacy iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Prepare the game patch and iOS host
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p tubbylegacy-port
          cd tubbylegacy-port
          cat > download_game.py <<'TUBBYLEGACY_DOWNLOAD_GAME_PY'
          """Fetch the exact TubbyLegacy prologue used for this port."""
          import hashlib
          import json
          import shutil
          import sys
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          UPLOAD = "https://rontheshotgunner.itch.io/tubbylegacy-the-last-custard/file/20269494"
          SHA256 = "782a8a75d1f0f0894d17a111896ebf41b7da3039f1b0f3221ab8c612b92a0ed5"


          def extract_game(source, destination):
              if hashlib.file_digest(source, "sha256").hexdigest() != SHA256:
                  raise ValueError("The prologue ZIP has changed. Review the files before applying the patch.")
              source.seek(0)
              with zipfile.ZipFile(source) as archive:
                  roots = [PurePosixPath(name).parent.parent for name in archive.namelist()
                           if PurePosixPath(name).parts[-2:] == ("Data", "Scripts.rxdata")]
                  if len(roots) != 1:
                      raise ValueError("Expected one RPG Maker XP game folder.")
                  root = roots[0]
                  for entry in archive.infolist():
                      path = PurePosixPath(entry.filename)
                      if entry.is_dir() or not path.is_relative_to(root) or ".." in path.parts:
                          continue
                      relative = path.relative_to(root)
                      if relative.parts[0] == "Graphics" and relative.suffix.lower() == ".ini":
                          continue
                      if relative.parts[0] not in {"Data", "Graphics", "Audio", "Game.ini", "CREDITS.txt"}:
                          continue
                      target = destination.joinpath(*relative.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as original, target.open("wb") as output:
                          shutil.copyfileobj(original, output)
              if not (destination / "Data" / "Scripts.rxdata").is_file():
                  raise ValueError("The archive is missing its RPG Maker XP scripts.")


          if __name__ == "__main__":
              target = Path(sys.argv[1])
              if len(sys.argv) == 3:
                  with open(sys.argv[2], "rb") as local:
                      extract_game(local, target)
              else:
                  with tempfile.TemporaryFile() as archive:
                      request = urllib.request.Request(UPLOAD, data=b"")
                      with urllib.request.urlopen(request, timeout=30) as response:
                          url = json.load(response)["url"]
                      with urllib.request.urlopen(url, timeout=90) as response:
                          shutil.copyfileobj(response, archive)
                      archive.seek(0)
                      extract_game(archive, target)
          TUBBYLEGACY_DOWNLOAD_GAME_PY
          cat > patch_game.rb <<'TUBBYLEGACY_PATCH_GAME_RB'
          # encoding: UTF-8
          require "fileutils"
          require "zlib"

          game, port = ARGV
          Dir.chdir(game)
          FileUtils.cp(File.join(port, "Locale.tsv"), "Locale.tsv")
          FileUtils.cp(File.join(port, "locale.rb"), "Locale.rb")
          File.write("Game.ini", "[Game]\nLibrary=RGSS104E.dll\nScripts=Data/Scripts.rxdata\nTitle=TubbyLegacy: The Last Custard\nRTP1=\nRTP2=\nRTP3=\n")
          File.write("mkxp.json", <<~JSON)
            {"rgssVersion":1,"fixedAspectRatio":true,"vsync":true,"useScriptNames":true,"anyAltToggleFS":false}
          JSON
          scripts = Marshal.load(File.binread("Data/Scripts.rxdata"))

          def edit(scripts, name)
            record = scripts.find { |entry| entry[1] == name } or abort "Missing script: #{name}"
            code = Zlib::Inflate.inflate(record[2]).force_encoding(Encoding::UTF_8).gsub("\r\n", "\n")
            replacement = yield code
            RubyVM::InstructionSequence.compile(replacement, name) if defined?(RubyVM::InstructionSequence)
            record[2] = Zlib::Deflate.deflate(replacement)
          end

          def replace!(code, from, to)
            abort "Patch target missing: #{from.inspect}" unless code.include?(from)
            code.gsub!(from) { to }
          end

          def localize_literals(code, strings)
            strings.each do |text|
              literal = text.dump
              replace!(code, literal, "LegacyLocale.text(#{literal})")
            end
          end

          edit(scripts, "Interpreter 3") do |code|
            replace!(code, '@list[@index].parameters[0] + "\n"', 'LegacyLocale.text(@list[@index].parameters[0]) + "\n"')
            replace!(code, '@list[@index+1].parameters[0] + "\n"', 'LegacyLocale.text(@list[@index+1].parameters[0]) + "\n"')
            code
          end
          edit(scripts, "Interpreter 1") do |code|
            replace!(code, '$game_temp.message_text += text + "\n"', '$game_temp.message_text += LegacyLocale.text(text) + "\n"')
            code
          end
          edit(scripts, "Scene_Title") do |code|
            localize_literals(code, ["New Game", "Continue", "Quit Game", "Press", "SPACE to Start"])
            replace!(code, '[s1, s2, s3]', '[s1, s2, LegacyLocale::MENU[LegacyLocale.index], s3]')
            replace!(code, '@target_y = 288', '@target_y = 272')
            replace!(code, "when 2\ncommand_shutdown", "when 2\n$scene = Scene_LegacyLanguage.new\nwhen 3\ncommand_shutdown")
            replace!(code, 'selected_quote = quote_pool[rand(quote_pool.size)]', 'selected_quote = LegacyLocale.text(quote_pool[rand(quote_pool.size)])')
            code
          end
          edit(scripts, "Scene_Menu") do |code|
            localize_literals(code, ["Save Game", "End Game"])
            replace!(code, '$data_system.words.item', 'LegacyLocale.text($data_system.words.item)')
            code
          end
          {
            "Scene_End" => ["To Title", "Quit Game", "Cancel"],
            "Scene_Save" => ["Which file would you like to save to?"],
            "Scene_Load" => ["Which file would you like to load?"],
            "Window_PlayTime" => ["Play Time"],
            "Window_Steps" => ["Step Count"]
          }.each do |name, strings|
            edit(scripts, name) { |code| localize_literals(code, strings); code }
          end
          edit(scripts, "Location_Tracker") do |code|
            localize_literals(code, ["Location:", "Location", "Prologue", "Unknown Area"])
            replace!(code, 'return $data_mapinfos[@map_id].name', 'return LegacyLocale.text($data_mapinfos[@map_id].name)')
            replace!(code, 'saved_map_name = $data_mapinfos[saved_map_id].name', 'saved_map_name = LegacyLocale.text($data_mapinfos[saved_map_id].name)')
            code
          end
          edit(scripts, "Objective_Tracker") do |code|
            localize_literals(code, ["Objective:"])
            replace!(code, '$game_variables[3].to_s', 'LegacyLocale.text($game_variables[3].to_s)')
            code
          end
          edit(scripts, "Save_File_9") do |code|
            replace!(code, '"File #{i + 1}"', 'LegacyLocale.text("File") + " #{i + 1}"')
            replace!(code, '"File #{@file_index + 1}"', 'LegacyLocale.text("File") + " #{@file_index + 1}"')
            code
          end
          edit(scripts, "Window_Item") do |code|
            replace!(code, "32, item.name, 0)", "32, LegacyLocale.text(item.name), 0)")
            code
          end
          edit(scripts, "Backpack_Text_Fix") do |code|
            replace!(code, 'words = text.to_s.split(" ")', 'words = LegacyLocale.text(text.to_s).split(" ")')
            code
          end
          edit(scripts, "Game_Over_Tips") do |code|
            replace!(code, 'selected_tip = tips[rand(tips.size)]', 'selected_tip = LegacyLocale.text(tips[rand(tips.size)])')
            code
          end
          # The released prologue has an empty Movies folder and no event calls to
          # play_movie. Its cutscenes are RPG Maker picture and dialogue events.
          edit(scripts, "Dialogue") do |code|
            replace!(code, "self.contents = Bitmap.new(width - 32, height - 32)",
                     "self.contents = Bitmap.new(width - 32, height - 32)\n    self.contents.font.size = 20")
            code
          end
          edit(scripts, "Scene_Movie") { |_code| "# Windows-only movie extension, unused in the prologue.\n" }
          edit(scripts, "Main") { |code| "load \"Locale.rb\"\n" + code }

          # Marshal 4.8 stores Ruby 3 String encoding metadata only for tagged strings.
          # Read all records as existing binary strings and keep the compressed sources binary.
          File.binwrite("Data/Scripts.rxdata", Marshal.dump(scripts))
