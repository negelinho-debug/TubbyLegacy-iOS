name: TubbyLegacy iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 309ed8be7cc89b30c8ac45548d89ea07287c63b5

      - name: Restore and prepare the port
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          source = Path(".github/workflows/build.yml").read_text(encoding="utf-8")
          restored = source.encode("latin-1")
          expected = "d57690b54c36a93b16432e7ac94561a03808836b3a0e51c1ee1a32b92f7f5a74"
          if hashlib.sha256(restored).hexdigest() != expected:
              raise SystemExit("Unexpected TubbyLegacy workflow contents")
          Path("recovered-build.yml").write_bytes(restored)
          PY
          ruby -ryaml -e '
            workflow = YAML.load_file("recovered-build.yml")
            puts workflow.fetch("jobs").fetch("package").fetch("steps").first.fetch("run")
          ' > "$RUNNER_TEMP/prepare-tubbylegacy.sh"
          bash "$RUNNER_TEMP/prepare-tubbylegacy.sh"

      - name: Build the IPA
        shell: bash
        run: |
          bash "$RUNNER_TEMP/tubbylegacy-port/build-ios.sh" "$RUNNER_TEMP/tubbylegacy-build" 2>&1 | tee "$RUNNER_TEMP/tubbylegacy-build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: TubbyLegacy-iOS-EN-RU-UK
          path: ${{ runner.temp }}/tubbylegacy-build/TubbyLegacy-v0.1.0-EN-RU-UK.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TubbyLegacy-build-log
          path: ${{ runner.temp }}/tubbylegacy-build.log
          if-no-files-found: ignore
