          cat > build-ios.sh <<'TUBBYLEGACY_BUILD_IOS_SH'
          #!/bin/bash
          set -euo pipefail
          port="$(cd "$(dirname "$0")" && pwd)"
          work="${1:?Pass an absolute build directory}"
          app="$work/Payload/TubbyLegacy.app"
          engine="$work/engine"
          angle="$work/angle"
          mkdir -p "$app" "$engine" "$angle"

          fetch() {
              local url="$1" digest="$2" destination="$3"
              curl -fLsS --retry 2 "$url" -o "$destination"
              echo "$digest  $destination" | shasum -a 256 -c
          }

          fetch 'https://github.com/mateo-m/mkxp-z-apple-mobile/releases/download/v17/mkxp-z-ios.tar.gz' \
              '6e6a77f36e8d7e58e658b5c12d15c9aae3722feb69d731b5a7f9463207ae9809' "$work/engine.tar.gz"
          fetch 'https://github.com/mateo-m/empo-deps/releases/download/angle-2026-11-01/angle-apple-prebuilt.tar.gz' \
              '22f6b332acaa9973650c30a99314287594fbf9ed38db682c2389bd34181e7831' "$work/angle.tar.gz"

          tar -xzf "$work/engine.tar.gz" -C "$engine"
          tar -xzf "$work/angle.tar.gz" -C "$angle"
          python3 "$port/download_game.py" "$app/Game"
          ruby "$port/patch_game.rb" "$app/Game" "$port"
          cp "$port/Info.plist" "$app/Info.plist"
          cp -R "$engine/assets" "$app/Assets.bundle"
          cp -R "$engine/iphoneos/ruby-stdlib" "$app/Ruby"
          cp "$engine/licenses.json" "$app/Assets.bundle/licenses.json"
          printf '%s\n' 'mkxp-z-apple-mobile, Copyright (C) 2026 Mateo M., https://github.com/mateo-m/mkxp-z-apple-mobile' > "$app/Assets.bundle/ENGINE-CREDITS.txt"

          flags=(-isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios26.0)
          xcrun --sdk iphoneos clang "${flags[@]}" -fobjc-arc -O2 -I"$engine/include" \
              -c "$port/Host.m" -o "$work/Host.o"
          (
              cd "$engine/iphoneos"
              xcrun --sdk iphoneos clang++ "${flags[@]}" -ObjC -L"$angle/iphoneos/lib" \
                  "$work/Host.o" $(cat "$engine/LINK") \
                  -framework ImageIO -weak_framework OpenGLES -o "$app/TubbyLegacy"
          )
          plutil -lint "$app/Info.plist"
          xcrun vtool -show-build "$app/TubbyLegacy" | grep -Eq 'platform[[:space:]]+IOS'
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict "$app"
          (
              cd "$work"
              zip -q -r "TubbyLegacy-v0.1.0-EN-RU-UK.ipa" Payload
          )
          unzip -tq "$work/TubbyLegacy-v0.1.0-EN-RU-UK.ipa"
          TUBBYLEGACY_BUILD_IOS_SH

      - name: Build and verify the IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          bash "$RUNNER_TEMP/tubbylegacy-port/build-ios.sh" "$RUNNER_TEMP/tubbylegacy-build" 2>&1 | tee "$RUNNER_TEMP/tubbylegacy-build.log"

      - name: Upload TubbyLegacy IPA
        uses: actions/upload-artifact@v4
        with:
          name: TubbyLegacy-iOS-EN-RU-UK
          path: ${{ runner.temp }}/tubbylegacy-build/TubbyLegacy-v0.1.0-EN-RU-UK.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubbyLegacy-build-log
          path: ${{ runner.temp }}/tubbylegacy-build.log
          if-no-files-found: ignore
